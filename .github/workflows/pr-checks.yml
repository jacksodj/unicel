# Merge gate: repo checks, secret scanning, and vulnerability scanning.
#
# The standard gate from the setup-new-repo skill, made generic for a repo that
# starts with no code: each step runs only when the files it checks exist, so
# the gate grows with the repo. The `tests` job also runs Unicel's own frontend
# build, Rust tests and format check (the fast, secret-free part of ci.yml).
#
# Runs on every branch push (so a leaked secret is flagged as soon as a branch
# reaches GitHub) and on PRs to main. The job names (tests, secrets,
# vulnerabilities) are the required status checks on main; keep them stable.
#
# Security posture: this workflow deliberately uses NO repository secrets and
# NO cloud credentials. A PR or branch can rewrite this file, so anything it
# could read could be exfiltrated. Never switch it to pull_request_target.

name: PR checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Never cancel runs on main: its secrets scan covers only before..after, so a
  # cancelled run would leave that push's commits unscanned. Branch pushes
  # rescan the whole branch (see the secrets job), so cancelling them is safe.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a cold Tauri build takes most of this; the cache cuts it down
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Find what to check
        id: scan
        run: |
          set -euo pipefail
          echo "tf=$(git ls-files '*.tf' '*.tofu' | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: shellcheck (git hooks, scripts, Claude hooks)
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '.githooks/*' 'scripts/*.sh' '.claude/hooks/*.sh')
          shellcheck -x "${files[@]}"

      # Unicel: the same build and test commands ci.yml runs, on Ubuntu only.
      # Clippy stays in ci.yml: it follows the newest stable toolchain, so a new
      # lint can turn it red without a code change.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20

      - name: Rust toolchain (stable, through the runner's rustup)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      # The Rust build embeds dist/, so the frontend builds first.
      - name: Build frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path=./src-tauri/Cargo.toml

      - name: Rust formatting
        run: cargo fmt --manifest-path=./src-tauri/Cargo.toml --check

      # OpenTofu / Terraform: format, validate, and lint any infrastructure code.
      # Destroys are never applied from here: if this repo grows real infra with
      # state, adopt the standard tofu-deploy-reusable.yml workflow (plan,
      # destroy-guard, `allow-destroy` label) and keep prevent_destroy = true on
      # stateful resources.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2.0.2
        if: steps.scan.outputs.tf != '0'
        with:
          tofu_wrapper: false

      - name: tofu fmt and validate
        if: steps.scan.outputs.tf != '0'
        run: |
          set -euo pipefail
          tofu fmt -check -recursive -diff
          git ls-files '*.tf' '*.tofu' | xargs -n1 dirname | sort -u | while read -r dir; do
            echo "::group::validate $dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        if: steps.scan.outputs.tf != '0'

      - name: tflint
        if: steps.scan.outputs.tf != '0'
        run: |
          tflint --init
          tflint --recursive

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"  # keep in step with .githooks/gitleaks-env.sh
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums.txt
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history: we scan every commit in the push/PR
          persist-credentials: false
          # For PRs, check out the PR head, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install gitleaks (checksum-verified release binary)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Work out which commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              opts="${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [[ "$BRANCH" != "$DEFAULT_BRANCH" ]]; then
                # Every commit on the branch that main doesn't have.
                opts="HEAD --not refs/remotes/origin/${DEFAULT_BRANCH}"
              elif [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                opts="HEAD"  # first push / main force-pushed / old tip gone: scan it all
              else
                opts="${BEFORE}..${AFTER}"
              fi ;;
            *)
              opts="--all" ;;  # manual run: whole history, every branch
          esac
          echo "Scanning: git log $opts"
          # Unquoted on purpose: split into args. No eval: refnames may contain `$(`.
          # shellcheck disable=SC2086
          echo "Commit count: $(git rev-list --count $opts)"
          echo "log_opts=$opts" >> "$GITHUB_OUTPUT"

      - name: gitleaks
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose \
            --exit-code 1 --log-opts="$LOG_OPTS" .

  vulnerabilities:
    name: vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Find dependency manifests and code
        id: scan
        run: |
          set -euo pipefail
          # .claude/ holds vendored agent skills, not project code.
          reqs="$(git ls-files 'requirements*.txt' '*/requirements*.txt' ':!:.claude/**' | tr '\n' ' ')"
          py="$(git ls-files '*.py' ':!:.claude/**' | wc -l | tr -d ' ')"
          npm="$(git ls-files 'package-lock.json' '*/package-lock.json' ':!:.claude/**' | tr '\n' ' ')"
          { echo "reqs=$reqs"; echo "py=$py"; echo "npm=$npm"; } >> "$GITHUB_OUTPUT"
          if [[ -z "${reqs// }" && "$py" == "0" && -z "${npm// }" ]]; then
            echo "Nothing to scan yet: no Python requirements, Python code, or npm lockfiles."
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.scan.outputs.reqs != '' || steps.scan.outputs.py != '0'
        with:
          python-version: "3.12"

      - name: Install Python scanners
        if: steps.scan.outputs.reqs != '' || steps.scan.outputs.py != '0'
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.10.1" "bandit==1.9.4"

      - name: pip-audit (known CVEs in Python dependencies)
        if: steps.scan.outputs.reqs != ''
        env:
          REQS: ${{ steps.scan.outputs.reqs }}
        run: |
          set -euo pipefail
          for f in $REQS; do pip-audit -r "$f" --strict --progress-spinner off; done

      - name: bandit (high severity, high confidence)
        if: steps.scan.outputs.py != '0'
        run: bandit -r . -lll -iii -x ./.claude,./.venv,./venv

      - name: npm audit (high and critical)
        if: steps.scan.outputs.npm != ''
        env:
          LOCKS: ${{ steps.scan.outputs.npm }}
        run: |
          set -euo pipefail
          for lock in $LOCKS; do (cd "$(dirname "$lock")" && npm audit --audit-level=high); done
